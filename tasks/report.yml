---
- name: Ensure controller report directory exists
  ansible.builtin.file:
    path: "{{ jenkins_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  changed_when: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Write report on the controller
  ansible.builtin.template:
    src: report.md.j2
    dest: "{{ jenkins_report_dir }}/{{ inventory_hostname }}_{{ jenkins_run_id }}.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  check_mode: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Copy report next to the backup on the server
  ansible.windows.win_template:
    src: report.md.j2
    dest: "{{ jenkins_run_dir }}\\report.md"
  when: jenkins_backup_done | default(false) | bool
  failed_when: false

- name: Show report
  ansible.builtin.debug:
    msg: "{{ (lookup('ansible.builtin.template', 'report.md.j2')).splitlines() }}"
