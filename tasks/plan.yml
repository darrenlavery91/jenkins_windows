---
- name: Version sanity
  ansible.builtin.assert:
    that:
      - jenkins_force_same_version | bool or jenkins_target_version != jenkins_current_version
      - jenkins_allow_downgrade | bool or not (jenkins_target_version is version(jenkins_current_version, '<'))
    fail_msg: >-
      Current version is {{ jenkins_current_version }}, target {{ jenkins_target_version }}.
      Same version needs jenkins_force_same_version=true; downgrades need jenkins_allow_downgrade=true.
    quiet: true

- name: Select Java for the target version
  ansible.builtin.include_tasks: java_select.yml

# ------------------------------------------------------------- plugin analysis
- name: Analyse installed plugins against the target core / Java
  ansible.builtin.set_fact:
    jenkins_plugin_findings: "{{ lookup('ansible.builtin.template', 'plugin_analysis.json.j2') | from_json }}"
  vars:
    jenkins_analysis_plugins: "{{ jenkins_plugins_before }}"

# ------------------------------------------------------------------ disk space
- name: Estimate backup size and free space
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'Get-BackupSizing.ps1') }}"
    parameters:
      JenkinsHome: "{{ jenkins_home }}"
      BackupDir: "{{ jenkins_backup_dir }}"
      ExcludeDirs: "{{ jenkins_backup_exclude_dirs }}"
  register: _sizing
  changed_when: false
  check_mode: false

- name: Fail early when the backup volume is too small
  ansible.builtin.assert:
    that: >-
      (_sizing.result.free_bytes | int) < 0 or
      (_sizing.result.free_bytes | int) > ((_sizing.result.home_bytes | int) * (jenkins_backup_space_factor | float))
    fail_msg: >-
      Backup volume has {{ (_sizing.result.free_bytes | int / 1073741824) | round(1) }} GiB free but the backup
      needs about {{ ((_sizing.result.home_bytes | int) * (jenkins_backup_space_factor | float) / 1073741824) | round(1) }} GiB.
    quiet: true

- name: Plan summary
  ansible.builtin.debug:
    msg:
      - "Jenkins {{ jenkins_current_version }} -> {{ jenkins_target_version }}"
      - "Supported Java for target: {{ jenkins_supported_java_majors | join(', ') }}"
      - "Java to use: {{ jenkins_java_major_selected }} ({{ 'will be INSTALLED' if jenkins_java_needs_install | bool else 'already installed at ' ~ jenkins_java_selected.home }})"
      - "Plugins installed: {{ jenkins_plugins_before | length }}"
      - "Plugin blockers: {{ jenkins_plugin_findings | selectattr('severity', 'equalto', 'BLOCKER') | list | length }}, warnings: {{ jenkins_plugin_findings | selectattr('severity', 'equalto', 'WARNING') | list | length }}, updates available: {{ jenkins_plugin_findings | selectattr('kind', 'equalto', 'update_available') | list | length }}"
      - "Backup estimate: {{ (_sizing.result.home_bytes | int / 1073741824) | round(2) }} GiB"
