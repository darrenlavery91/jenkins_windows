---
# Pick the Java major/JDK for jenkins_target_version from jenkins_java_installs.
# Shared by plan.yml (upgrade) and install.yml. Read-only.
- name: Work out which Java majors this Jenkins release supports
  ansible.builtin.set_fact:
    jenkins_target_baseline: "{{ jenkins_target_version.split('.')[0:2] | join('.') }}"
    jenkins_supported_java_majors: []

- name: Evaluate support matrix
  ansible.builtin.set_fact:
    jenkins_supported_java_majors: "{{ jenkins_supported_java_majors + [item.java | int] }}"
  loop: "{{ jenkins_java_support }}"
  loop_control:
    label: "Java {{ item.java }}"
  when:
    - jenkins_target_baseline is version(item.min_core, '>=')
    - item.max_core is none or jenkins_target_baseline is version(item.max_core, '<=')

- name: Fail if the matrix has no supported Java
  ansible.builtin.assert:
    that: jenkins_supported_java_majors | length > 0
    fail_msg: "No supported Java for Jenkins {{ jenkins_target_version }} in vars/main.yml (jenkins_java_support)."
    quiet: true

- name: Validate forced Java major
  ansible.builtin.assert:
    that: (jenkins_java_major | int) in jenkins_supported_java_majors
    fail_msg: >-
      Jenkins {{ jenkins_target_version }} supports Java {{ jenkins_supported_java_majors | join(', ') }};
      jenkins_java_major={{ jenkins_java_major }} is not one of them.
    quiet: true
  when: jenkins_java_major | string | length > 0

- name: Order of preferred Java majors
  ansible.builtin.set_fact:
    jenkins_java_wanted_order: >-
      {{ [jenkins_java_major | int] if (jenkins_java_major | string | length > 0)
         else ((jenkins_java_preference | map('int') | select('in', jenkins_supported_java_majors) | list)
               or (jenkins_supported_java_majors | sort(reverse=true))) }}
    jenkins_java_usable: >-
      {{ jenkins_java_installs | selectattr('is64')
         | selectattr('openj9', 'in', ([false] if not (jenkins_java_allow_openj9 | bool) else [true, false])) | list }}

- name: Usable Java majors
  ansible.builtin.set_fact:
    jenkins_java_usable_majors: "{{ jenkins_java_usable | map(attribute='major') | map('int') | unique | list }}"

- name: Validate explicit jenkins_java_home
  ansible.builtin.assert:
    that:
      - jenkins_java_installs | selectattr('requested') | list | length > 0
      - (jenkins_java_installs | selectattr('requested') | list | first).major | int in jenkins_supported_java_majors
    fail_msg: >-
      jenkins_java_home='{{ jenkins_java_home }}' is not a usable 64-bit JDK/JRE (Java 9+ layout)
      or its major version is not supported by Jenkins {{ jenkins_target_version }}
      (supported: {{ jenkins_supported_java_majors | join(', ') }}).
    quiet: true
  when: jenkins_java_home | string | length > 0

- name: Select Java major
  ansible.builtin.set_fact:
    jenkins_java_major_selected: >-
      {%- if jenkins_java_home | string | length > 0 -%}
      {{ (jenkins_java_installs | selectattr('requested') | list | first).major }}
      {%- else -%}
      {%- set have = jenkins_java_wanted_order | select('in', jenkins_java_usable_majors) | list -%}
      {{ (have | first) if (jenkins_java_strategy == 'minimal' and have | length > 0) else (jenkins_java_wanted_order | first) }}
      {%- endif -%}

- name: Do we need to install Java?
  ansible.builtin.set_fact:
    jenkins_java_needs_install: >-
      {{ (jenkins_java_home | string | length == 0) and ((jenkins_java_major_selected | int) not in jenkins_java_usable_majors) }}

- name: Refuse to install Java when auto-install is off
  ansible.builtin.assert:
    that: jenkins_java_auto_install | bool
    fail_msg: >-
      Jenkins {{ jenkins_target_version }} needs Java {{ jenkins_java_major_selected }} which is not installed
      and jenkins_java_auto_install is false.
    quiet: true
  when: jenkins_java_needs_install | bool

- name: Check MSI source is configured for the Java install
  ansible.builtin.assert:
    that: jenkins_java_msi_urls[jenkins_java_major_selected | string] is defined
    fail_msg: >-
      Jenkins {{ jenkins_target_version }} needs Java {{ jenkins_java_major_selected }} which is not installed.
      Set jenkins_java_msi_urls['{{ jenkins_java_major_selected }}'] to an MSI path/URL,
      or use jenkins_java_install_method=chocolatey (requires the chocolatey.chocolatey collection).
    quiet: true
  when:
    - jenkins_java_needs_install | bool
    - jenkins_java_install_method == 'msi'

- name: Pick the Java install to use (when already present)
  ansible.builtin.set_fact:
    jenkins_java_selected: >-
      {{ (jenkins_java_installs | selectattr('requested') | list | first)
         if (jenkins_java_home | string | length > 0)
         else (jenkins_java_usable | selectattr('major', 'equalto', jenkins_java_major_selected | int)
               | sort(attribute='sort_key') | last) }}
  when: not (jenkins_java_needs_install | bool)

- name: Java warnings
  ansible.builtin.set_fact:
    jenkins_warnings: >-
      {{ jenkins_warnings + ['Java 17 is supported only up to Jenkins 2.544 (final LTS 2.541.3). The next releases require Java 21+; plan the move to Java 21.'] }}
  when: (jenkins_java_major_selected | int) == 17
