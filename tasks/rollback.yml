---
# Standalone rollback:
#   - ansible.builtin.include_role:
#       name: jenkins_windows
#       tasks_from: rollback
#     vars: { jenkins_backup_dir: 'E:\Jenkins_Backups', jenkins_rollback_backup_id: '20261111-064800' }
- name: Normalise backup dir
  ansible.builtin.set_fact:
    jenkins_backup_dir: >-
      {{ (jenkins_backup_dir | string | trim).rstrip('\\/') }}

- name: List complete backups (manifest.json present)
  ansible.windows.win_powershell:
    script: |
      param([string]$Dir)
      $all = @()
      if (Test-Path -LiteralPath $Dir) {
        $all = @(Get-ChildItem -LiteralPath $Dir -Directory |
          Where-Object { $_.Name -match '^\d{8}-\d{6}$' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'manifest.json')) } |
          Sort-Object Name | ForEach-Object { $_.FullName })
      }
      $Ansible.Result = @{ backups = $all }
    parameters:
      Dir: "{{ jenkins_backup_dir }}"
  register: _backups
  changed_when: false

- name: Choose backup
  ansible.builtin.set_fact:
    jenkins_restore_dir: >-
      {%- if jenkins_rollback_backup_id | length > 0 -%}
      {{ _backups.result.backups | select('match', '^.*' ~ (jenkins_rollback_backup_id | regex_escape) ~ '$') | first | default('') }}
      {%- else -%}
      {{ _backups.result.backups | last | default('') }}
      {%- endif -%}

- name: Fail if no backup found
  ansible.builtin.assert:
    that: jenkins_restore_dir | length > 0
    fail_msg: "No complete backup (with manifest.json) found in {{ jenkins_backup_dir }} (id='{{ jenkins_rollback_backup_id }}'). Available: {{ _backups.result.backups | map('win_basename') | join(', ') or 'none' }}"
    quiet: true

- name: Read manifest
  ansible.builtin.slurp:
    src: "{{ jenkins_restore_dir }}\\manifest.json"
  register: _manifest

- name: Parse manifest
  ansible.builtin.set_fact:
    jenkins_restore_manifest: "{{ _manifest.content | b64decode | from_json }}"
    jenkins_run_id: "{{ jenkins_restore_dir | win_basename }}"
    jenkins_run_dir: "{{ jenkins_restore_dir }}"
    jenkins_current_version: "{{ (_manifest.content | b64decode | from_json).from_version }}"
    jenkins_target_version: "{{ (_manifest.content | b64decode | from_json).to_version }}"
    jenkins_warnings: []
    jenkins_plan_only: false

- name: Restore
  ansible.builtin.include_tasks: restore.yml
  vars:
    jenkins_failure_reason: "manual rollback requested"

- name: Finish
  ansible.builtin.debug:
    msg: "Rolled back {{ inventory_hostname }} to Jenkins {{ jenkins_restore_manifest.from_version }} from {{ jenkins_restore_dir }}"
