---
- name: Normalise inputs
  ansible.builtin.set_fact:
    jenkins_target_version: "{{ jenkins_target_version | string | trim }}"
    jenkins_home: >-
      {{ (jenkins_home | string | trim).rstrip('\\/') }}
    jenkins_install_dir: >-
      {{ (jenkins_install_dir | string | trim).rstrip('\\/') }}
    jenkins_backup_dir: >-
      {{ (jenkins_backup_dir | string | trim).rstrip('\\/') }}
    jenkins_war_source_dir: >-
      {{ (jenkins_war_source_dir | string | trim).rstrip('\\/') }}
    jenkins_run_id: "{{ now(utc=true, fmt='%Y%m%d-%H%M%S') }}"

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family | default('Windows') == 'Windows'
      - jenkins_mode in ['upgrade', 'install', 'uninstall']
      - jenkins_mode == 'uninstall' or jenkins_target_version is match('^2\.[0-9]+(\.[0-9]+)?$')
      - jenkins_home | length > 0
      - jenkins_install_dir | length > 0
      - jenkins_service_name | length > 0
      - jenkins_backup_dir | length > 0
      - jenkins_java_install_method in ['chocolatey', 'msi']
      - jenkins_java_strategy in ['minimal', 'preferred']
      - jenkins_startup_type in ['auto', 'bat', 'winsw']
      - jenkins_simulate_failure in ['', 'before_stop', 'after_backup', 'after_start']
      - not (jenkins_backup_dir | lower).startswith((jenkins_home | lower) ~ '\\')
      - not (jenkins_backup_dir | lower).startswith((jenkins_install_dir | lower) ~ '\\')
    fail_msg: >-
      Invalid input. jenkins_mode must be upgrade, install or uninstall. jenkins_target_version must be a quoted version such as "2.544" or
      "2.541.3"; jenkins_home, jenkins_install_dir, jenkins_service_name and
      jenkins_backup_dir are required; the backup directory must sit OUTSIDE both
      jenkins_home and jenkins_install_dir. Windows targets only.
    quiet: true

- name: Derived paths
  ansible.builtin.set_fact:
    jenkins_run_dir: '{{ jenkins_backup_dir }}\{{ jenkins_run_id }}'
    # winsw = service XML (jenkins.xml from the official MSI); bat = start script
    jenkins_startup_kind: >-
      {{ jenkins_startup_type if jenkins_startup_type != 'auto'
         else ('winsw' if (jenkins_startup_script | lower).endswith('.xml') else 'bat') }}
    jenkins_has_api_creds: "{{ (jenkins_admin_user | length > 0) and (jenkins_admin_api_token | length > 0) }}"
    # install: password for the bootstrap admin
    jenkins_admin_secret: "{{ jenkins_admin_password if (jenkins_admin_password | length > 0) else jenkins_admin_api_token }}"
    jenkins_warnings: []
