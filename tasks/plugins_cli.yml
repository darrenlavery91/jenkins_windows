---
# Install/update jenkins_cli_plugins through the Jenkins CLI, restart, re-check.
# Inputs: jenkins_cli_plugins (list of plugin ids, may be name:version),
#         jenkins_cli_jar (where to put jenkins-cli.jar on the server).
# Sets jenkins_plugin_update_rc / jenkins_plugin_update_output.
- name: Download jenkins-cli.jar from the running controller
  ansible.windows.win_get_url:
    url: "{{ jenkins_url }}/jnlpJars/jenkins-cli.jar"
    dest: "{{ jenkins_cli_jar }}"
    url_username: "{{ jenkins_admin_user }}"
    url_password: "{{ jenkins_admin_api_token }}"
    force_basic_auth: true
    validate_certs: "{{ jenkins_validate_certs }}"
  no_log: "{{ jenkins_no_log }}"

- name: Install / update plugins (dependencies resolved by Jenkins)
  ansible.windows.win_command: >-
    "{{ jenkins_java_selected.home }}\bin\java.exe" -jar "{{ jenkins_cli_jar }}"
    -s {{ jenkins_url }} {{ jenkins_cli_extra_args }} install-plugin {{ jenkins_cli_plugins | join(' ') }}
  environment:
    JENKINS_USER_ID: "{{ jenkins_admin_user }}"
    JENKINS_API_TOKEN: "{{ jenkins_admin_api_token }}"
  register: _cli
  failed_when: false
  no_log: "{{ jenkins_no_log }}"

- name: Record CLI outcome
  ansible.builtin.set_fact:
    jenkins_plugin_update_rc: "{{ _cli.rc | default(-1) }}"
    jenkins_plugin_update_output: "{{ (_cli.stdout_lines | default([])) + (_cli.stderr_lines | default([])) }}"
    jenkins_warnings: >-
      {{ jenkins_warnings + (['Plugin install/update via CLI returned exit code ' ~ _cli.rc ~ ' - no restart done. Check the CLI output in the report: Jenkins may not reach the update center, the credentials may be wrong, or jenkins_url may not match the Jenkins URL configured in Manage Jenkins > System (CLI -webSocket origin check).'] if (_cli.rc | default(-1) | int) != 0 else []) }}

- name: Restart Jenkins to activate the plugins
  ansible.windows.win_service:
    name: "{{ jenkins_service_name }}"
    state: restarted
  when: (jenkins_plugin_update_rc | int) == 0

- name: Wait for Jenkins after plugin restart
  ansible.windows.win_uri:
    url: "{{ jenkins_health_url }}"
    validate_certs: "{{ jenkins_validate_certs }}"
    status_code: "{{ jenkins_health_status_codes }}"
  register: _health2
  until: (_health2.status_code | default(0) | int) in jenkins_health_status_codes
  retries: "{{ jenkins_health_retries }}"
  delay: "{{ jenkins_health_delay }}"
  failed_when: false

- name: Fail if Jenkins did not return after the plugin restart
  ansible.builtin.assert:
    that: (_health2.status_code | default(0) | int) in jenkins_health_status_codes
    fail_msg: "Jenkins did not come back after the plugin install/update restart."
    quiet: true

- name: Re-check failed plugins after the restart
  ansible.builtin.include_tasks: failed_plugins.yml
  vars:
    jenkins_failed_stage: final
