---
# Entry point. jenkins_mode: upgrade (plan -> execute -> report), install, uninstall.
- name: Validate inputs
  ansible.builtin.include_tasks: validate.yml
  tags: [always]

- name: Install Jenkins
  ansible.builtin.include_tasks: install.yml
  when: jenkins_mode == 'install'

- name: Uninstall Jenkins
  ansible.builtin.include_tasks: uninstall.yml
  when: jenkins_mode == 'uninstall'

- name: Upgrade Jenkins
  when: jenkins_mode == 'upgrade'
  block:
    - name: Discover current state (service, Java, plugins, update center)
      ansible.builtin.include_tasks: discover.yml

    - name: Build compatibility plan (Java + plugins + disk)
      ansible.builtin.include_tasks: plan.yml

    - name: Execute upgrade (backup, stop, switch, start, verify, rollback on failure)
      ansible.builtin.include_tasks: execute.yml
      when: not (jenkins_plan_only | bool)

    - name: Plan-only report
      ansible.builtin.include_tasks: report.yml
      when: jenkins_plan_only | bool
