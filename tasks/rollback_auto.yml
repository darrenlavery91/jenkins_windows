---
# Called from the rescue section of execute.yml.
- name: Full rollback (backup exists)
  ansible.builtin.include_tasks: restore.yml
  vars:
    jenkins_restore_dir: "{{ jenkins_run_dir }}"
    jenkins_restore_manifest: "{{ jenkins_manifest }}"
  when:
    - jenkins_rollback_on_failure | bool
    - jenkins_backup_done | default(false) | bool

- name: Nothing to restore - just make sure the service is running again
  ansible.windows.win_service:
    name: "{{ jenkins_service_name }}"
    state: started
  failed_when: false
  when:
    - not (jenkins_backup_done | default(false) | bool)
    - jenkins_stopped_by_role | default(false) | bool

- name: Failed before the stop - leave quiet-down mode so builds can run again
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'Invoke-JenkinsApi.ps1') }}"
    parameters:
      BaseUrl: "{{ jenkins_url }}"
      Path: /cancelQuietDown
      Method: POST
      User: "{{ jenkins_admin_user }}"
      Token: "{{ jenkins_admin_api_token }}"
      ValidateCerts: "{{ jenkins_validate_certs | bool }}"
  no_log: "{{ jenkins_no_log }}"
  failed_when: false
  when:
    - jenkins_quieted_by_role | default(false) | bool
    - not (jenkins_stopped_by_role | default(false) | bool)
