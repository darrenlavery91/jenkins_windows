---
# Needs API credentials (Script Console permission). Sets jenkins_failed_plugins.
- name: Query script console for failed / inactive plugins
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'Invoke-JenkinsApi.ps1') }}"
    parameters:
      BaseUrl: "{{ jenkins_url }}"
      Path: /scriptText
      Method: POST
      User: "{{ jenkins_admin_user }}"
      Token: "{{ jenkins_admin_api_token }}"
      Form:
        script: "{{ jenkins_groovy_plugin_check }}"
      ValidateCerts: "{{ jenkins_validate_certs | bool }}"
  register: _failed_api
  changed_when: false
  no_log: "{{ jenkins_no_log }}"
  when: jenkins_has_api_creds | bool

- name: Normalise script console answer
  ansible.builtin.set_fact:
    _failed:
      status_code: "{{ _failed_api.result.status | default(0) }}"
      content: "{{ _failed_api.result.content | default('') }}"
  when: jenkins_has_api_creds | bool

- name: Parse result
  ansible.builtin.set_fact:
    jenkins_failed_plugins: >-
      {%- set out = [] -%}
      {%- for line in (_failed.content | default('')).splitlines() if line.startswith('FAILED|') or line.startswith('INACTIVE|') -%}
      {%- set f = line.split('|') -%}
      {%- set _ = out.append({'kind': f[0], 'name': f[1], 'detail': (f[2] | default('')) if f[0] == 'FAILED' else ('version ' ~ (f[2] | default('')))}) -%}
      {%- endfor -%}
      {{ out }}
    jenkins_failed_plugins_checked: "{{ (_failed.status_code | default(0) | int) == 200 }}"

- name: Warn when the script console refused the request
  ansible.builtin.set_fact:
    jenkins_warnings: >-
      {{ jenkins_warnings + ['Failed-plugin check (' ~ jenkins_failed_stage | default('') ~ '): ' ~ jenkins_url ~ '/scriptText returned HTTP '
         ~ (_failed.status_code | default('n/a')) ~ '. Check the user has Overall/Administer and that jenkins_url is reachable from the server.'] }}
  when:
    - jenkins_has_api_creds | bool
    - not (jenkins_failed_plugins_checked | bool)

- name: Not checked (no credentials or console unavailable)
  ansible.builtin.set_fact:
    jenkins_failed_plugins: []
    jenkins_failed_plugins_checked: false
  when: not (jenkins_has_api_creds | bool)

- name: Roll back when plugins failed and policy says so
  ansible.builtin.assert:
    that: jenkins_failed_plugins | length == 0 or not (jenkins_plugins_fail_rollback | bool)
    fail_msg: "{{ jenkins_failed_plugins | length }} plugin(s) failed to load: {{ jenkins_failed_plugins | map(attribute='name') | join(', ') }}"
    quiet: true
